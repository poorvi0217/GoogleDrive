spring.application.name=API-Gateway

server.port=3333
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
management.endpoints.web.exposure.include=*
spring.config.import=optional:configserver:

# Route to hello-api (Using MVC Prefix + Wildcard matching for sub-paths)
spring.cloud.gateway.mvc.routes[0].id=drive-service
spring.cloud.gateway.mvc.routes[0].uri=lb://DRIVE-SERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/**
